<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kabwe Clinic Directory</title>
  <meta name="description" content="Find, add and update health clinics in Kabwe.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231f6f5c' d='M11 2h10v9h9v10h-9v9H11v-9H2V11h9z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    // Apply a saved theme before the page paints so it never flashes the wrong colours.
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* storage blocked: follow the system setting */ }
  </script>
  <style>
    /* Theme tokens ----------------------------------------------------
       Light is the default; dark follows the system unless the visitor
       picks a theme with the toggle (stored as data-theme on <html>). */
    :root {
      --bg: #e8edf5;
      --blob-1: rgba(64, 196, 160, 0.45);
      --blob-2: rgba(132, 112, 255, 0.35);
      --blob-3: rgba(255, 168, 120, 0.40);
      --ink: #142033;
      --muted: #56657a;
      --rule: rgba(20, 33, 51, 0.12);
      --glass: rgba(255, 255, 255, 0.52);
      --glass-strong: rgba(255, 255, 255, 0.72);
      --glass-edge: rgba(255, 255, 255, 0.75);
      --glass-shadow: 0 10px 40px -12px rgba(40, 60, 100, 0.28);
      --clay: #eef2f8;
      --clay-well: #e3e9f2;
      --clay-dark: rgba(150, 165, 192, 0.55);
      --clay-light: rgba(255, 255, 255, 0.95);
      --scrubs: #1f8a70;
      --scrubs-2: #2fb38f;
      --scrubs-ink: #ffffff;
      --scrubs-soft: rgba(47, 179, 143, 0.16);
      --alert: #c0392b;
      --alert-ink: #ffffff;
      --alert-soft: rgba(192, 57, 43, 0.10);
      --focus: #2457c5;
      --toast-bg: rgba(20, 32, 51, 0.82);
      --toast-ink: #f4f7fb;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b111c;
        --blob-1: rgba(47, 179, 143, 0.30);
        --blob-2: rgba(110, 90, 255, 0.28);
        --blob-3: rgba(255, 130, 90, 0.18);
        --ink: #e8eef6;
        --muted: #9aa9bd;
        --rule: rgba(255, 255, 255, 0.09);
        --glass: rgba(22, 32, 48, 0.55);
        --glass-strong: rgba(26, 38, 56, 0.78);
        --glass-edge: rgba(255, 255, 255, 0.09);
        --glass-shadow: 0 14px 44px -14px rgba(0, 0, 0, 0.7);
        --clay: #1b2638;
        --clay-well: #141d2c;
        --clay-dark: rgba(0, 0, 0, 0.55);
        --clay-light: rgba(255, 255, 255, 0.07);
        --scrubs: #4fd1ab;
        --scrubs-2: #2fb38f;
        --scrubs-ink: #062a20;
        --scrubs-soft: rgba(79, 209, 171, 0.14);
        --alert: #ff8a7a;
        --alert-ink: #2a0e0b;
        --alert-soft: rgba(255, 138, 122, 0.12);
        --focus: #8fb0ff;
        --toast-bg: rgba(232, 238, 246, 0.9);
        --toast-ink: #142033;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b111c;
      --blob-1: rgba(47, 179, 143, 0.30);
      --blob-2: rgba(110, 90, 255, 0.28);
      --blob-3: rgba(255, 130, 90, 0.18);
      --ink: #e8eef6;
      --muted: #9aa9bd;
      --rule: rgba(255, 255, 255, 0.09);
      --glass: rgba(22, 32, 48, 0.55);
      --glass-strong: rgba(26, 38, 56, 0.78);
      --glass-edge: rgba(255, 255, 255, 0.09);
      --glass-shadow: 0 14px 44px -14px rgba(0, 0, 0, 0.7);
      --clay: #1b2638;
      --clay-well: #141d2c;
      --clay-dark: rgba(0, 0, 0, 0.55);
      --clay-light: rgba(255, 255, 255, 0.07);
      --scrubs: #4fd1ab;
      --scrubs-2: #2fb38f;
      --scrubs-ink: #062a20;
      --scrubs-soft: rgba(79, 209, 171, 0.14);
      --alert: #ff8a7a;
      --alert-ink: #2a0e0b;
      --alert-soft: rgba(255, 138, 122, 0.12);
      --focus: #8fb0ff;
      --toast-bg: rgba(232, 238, 246, 0.9);
      --toast-ink: #142033;
      color-scheme: dark;
    }
    :root {
      /* Claymorphism: soft outer shadows plus inner highlights make a puffy, moulded surface. */
      --clay-raised: 10px 10px 22px var(--clay-dark), -8px -8px 18px var(--clay-light),
                     inset 2px 2px 3px var(--clay-light), inset -3px -3px 6px var(--clay-dark);
      --clay-small: 5px 5px 12px var(--clay-dark), -4px -4px 10px var(--clay-light),
                    inset 1px 1px 2px var(--clay-light), inset -2px -2px 4px var(--clay-dark);
      --clay-pressed: inset 4px 4px 9px var(--clay-dark), inset -4px -4px 9px var(--clay-light);
      --radius-card: 28px;
      --radius-control: 14px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* Soft colour blobs behind everything give the glass something to blur. */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(38vmax 38vmax at 8% 12%, var(--blob-1), transparent 70%),
        radial-gradient(34vmax 34vmax at 92% 18%, var(--blob-2), transparent 70%),
        radial-gradient(40vmax 40vmax at 70% 95%, var(--blob-3), transparent 70%);
    }
    button, input, select { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .page { max-width: 1320px; margin: 0 auto; padding: 24px 16px 64px; }

    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--glass-shadow);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: var(--glass-strong); }
    }

    /* Header ---------------------------------------------------------- */
    .masthead {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px 24px; padding: 20px 24px; margin-bottom: 28px; border-radius: var(--radius-card);
    }
    .masthead h1 {
      margin: 0; font-size: clamp(1.8rem, 4.2vw, 3rem); line-height: 1.05; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 14px;
    }
    .masthead h1 .cross {
      flex: none; display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; border-radius: 0.34em;
      background: linear-gradient(145deg, var(--scrubs-2), var(--scrubs));
      box-shadow: var(--clay-small);
    }
    .masthead h1 .cross::after {
      content: ""; width: 0.56em; height: 0.56em; background: var(--scrubs-ink);
      clip-path: polygon(35% 0, 65% 0, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0 65%, 0 35%, 35% 35%);
    }

    .theme-toggle {
      appearance: none; flex: none; display: inline-flex; align-items: center; gap: 10px;
      min-height: 48px; padding: 8px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--clay); color: var(--ink); font-weight: 700; box-shadow: var(--clay-small);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .theme-toggle:hover { transform: translateY(-1px); }
    .theme-toggle:active { box-shadow: var(--clay-pressed); transform: none; }
    .theme-toggle .knob {
      display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(145deg, #ffd36e, #ffae42); color: #5a3a00; box-shadow: var(--clay-small);
    }
    :root[data-theme="dark"] .theme-toggle .knob { background: linear-gradient(145deg, #8fa2ff, #5b6cf0); color: #10163a; }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .moon { display: block; }

    .layout { display: grid; gap: 28px; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; }
    .register { container-type: inline-size; min-width: 0; border-radius: var(--radius-card); padding: 22px; }

    /* Form: a clay card ------------------------------------------------ */
    .slip {
      position: sticky; top: 16px;
      background: var(--clay);
      border-radius: var(--radius-card);
      box-shadow: var(--clay-raised);
      padding: 26px 22px 24px;
      transition: box-shadow 0.2s ease, background-color 0.3s ease;
    }
    .slip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .slip h2 { margin: 0; font-size: 1.35rem; }
    .slip .slip-no {
      color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums;
      padding: 2px 10px; border-radius: 999px; box-shadow: var(--clay-pressed);
    }
    .slip .slip-no:empty { display: none; }
    .slip.is-editing { box-shadow: 0 0 0 3px var(--scrubs), var(--clay-raised); }

    .field { display: grid; gap: 4px; padding: 7px 0; }
    .field label { font-size: 0.85rem; color: var(--muted); font-weight: 700; padding-left: 4px; }
    .field input, .field select {
      width: 100%; border: 0; border-radius: var(--radius-control); background: var(--clay-well);
      padding: 10px 14px; font-size: 1.02rem; min-height: 44px; box-shadow: var(--clay-pressed);
    }
    .field input::placeholder { color: var(--muted); opacity: 0.8; }
    .field input:focus-visible, .field select:focus-visible { outline: none; box-shadow: var(--clay-pressed), 0 0 0 2px var(--scrubs); }
    .field .err { color: var(--alert); font-size: 0.85rem; padding-left: 4px; }
    .field .err:empty { display: none; }
    .field.has-error input { box-shadow: var(--clay-pressed), 0 0 0 2px var(--alert); }
    .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .field-check {
      display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 12px 14px;
      border-radius: var(--radius-control); box-shadow: var(--clay-small); cursor: pointer;
    }
    .field-check input { width: 20px; height: 20px; accent-color: var(--scrubs); margin: 0; }
    .req { color: var(--alert); }

    .slip-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .btn {
      appearance: none; border: 0; background: var(--clay); color: var(--ink);
      border-radius: 16px; padding: 10px 20px; min-height: 46px; cursor: pointer; font-weight: 700;
      box-shadow: var(--clay-small); transition: box-shadow 0.15s ease, transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { box-shadow: var(--clay-pressed); transform: none; }
    .btn-primary {
      background: linear-gradient(145deg, var(--scrubs-2), var(--scrubs)); color: var(--scrubs-ink);
      box-shadow: 6px 8px 18px -4px rgba(31, 138, 112, 0.55), inset 2px 2px 4px rgba(255, 255, 255, 0.35), inset -3px -3px 6px rgba(0, 0, 0, 0.18);
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:active { box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.25); }
    .btn:disabled { opacity: 0.6; cursor: progress; transform: none; }
    .btn[hidden] { display: none; }

    /* Register (the list): a glass panel ------------------------------- */
    .register-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .register-bar h2 { margin: 0; font-size: 1.35rem; }
    .search {
      display: flex; align-items: center; gap: 8px; min-width: min(100%, 320px); padding: 0 14px;
      border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--glass-edge);
    }
    .search input { border: 0; background: transparent; padding: 10px 0; flex: 1; min-width: 0; }
    .search input:focus-visible { outline: none; }
    .search:focus-within { box-shadow: 0 0 0 2px var(--scrubs); }
    .search svg { flex: none; color: var(--muted); }

    .status { margin: 0 0 10px; font-size: 0.95rem; }
    .status:empty { display: none; }
    .status.ok { color: var(--scrubs); }
    .status.bad { color: var(--alert); }

    table { width: 100%; border-collapse: separate; border-spacing: 0; background: transparent; }
    caption { text-align: left; color: var(--muted); font-size: 0.9rem; padding: 0 0 8px; caption-side: top; }
    th, td { text-align: left; padding: 13px 12px; vertical-align: top; border-bottom: 1px solid var(--rule); }
    thead th { font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--rule); }
    tbody tr { transition: background-color 0.15s ease; }
    tbody tr:hover { background: var(--glass-strong); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.is-editing { background: var(--scrubs-soft); }
    tbody tr.flash { animation: flash 1.6s ease-out; }
    @keyframes flash { from { background: var(--scrubs-soft); } to { background: transparent; } }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .c-name { font-weight: 700; }
    .c-sub { display: block; color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
    .c-sub a[href^="tel:"] { white-space: nowrap; }
    /* Room inside the scroll box so the clay shadows on the row buttons are not cut off. */
    #register { overflow-x: auto; padding: 4px 16px 16px 4px; margin: -4px -16px -16px -4px; }
    .c-sub a { color: inherit; }
    .walkin {
      display: inline-block; font-size: 0.82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      background: var(--glass-strong); border: 1px solid var(--glass-edge); color: var(--muted);
    }
    .walkin.yes { background: var(--scrubs-soft); border-color: transparent; color: var(--scrubs); }
    .row-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .link-btn {
      appearance: none; border: 0; padding: 6px 14px; min-height: 36px; cursor: pointer; font-weight: 700;
      color: var(--ink); background: var(--clay); border-radius: 12px; box-shadow: var(--clay-small);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .link-btn:hover { transform: translateY(-1px); }
    .link-btn:active { box-shadow: var(--clay-pressed); transform: none; }
    .link-btn.danger { color: var(--alert); }
    .row-actions .link-btn { white-space: nowrap; }
    tbody tr.is-confirming, tbody tr.confirm-row { background: var(--alert-soft); }
    tbody tr.is-confirming td { border-bottom: 0; }
    .confirm-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border-left: 3px solid var(--alert); border-radius: 4px; }
    .confirm-q { color: var(--ink); }
    .confirm-q strong { color: var(--alert); }
    .confirm-btns { display: flex; gap: 8px; }
    .link-btn.confirm { background: var(--alert); color: var(--alert-ink); }

    /* Quick filters + sort: clay pills */
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      appearance: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 16px;
      border: 0; border-radius: 999px; background: var(--clay); color: var(--ink); cursor: pointer; box-shadow: var(--clay-small);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip[aria-pressed="true"] {
      background: linear-gradient(145deg, var(--scrubs-2), var(--scrubs)); color: var(--scrubs-ink); font-weight: 700;
      box-shadow: inset 3px 3px 7px rgba(0, 0, 0, 0.22), inset -2px -2px 5px rgba(255, 255, 255, 0.25);
      transform: none;
    }
    .chip .n { font-variant-numeric: tabular-nums; font-size: 0.85rem; opacity: 0.8; }
    .chip .tick { display: none; }
    .chip[aria-pressed="true"] .tick { display: inline; }
    .sort { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.95rem; }
    .sort select {
      border: 0; border-radius: var(--radius-control); background: var(--clay-well); padding: 8px 12px; min-height: 40px;
      color: var(--ink); box-shadow: var(--clay-pressed);
    }

    /* Open-now status */
    .hours { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; }
    .open-state { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 700; white-space: nowrap; }
    .open-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
    .open-state.is-open { color: var(--scrubs); }
    .open-state.is-closed { color: var(--muted); }
    .open-state.is-closed::before { box-shadow: none; }

    /* Loading skeleton */
    .skeleton { padding: 6px 4px; }
    .skeleton div { height: 54px; border-bottom: 1px solid var(--rule); position: relative; overflow: hidden; }
    .skeleton div::after {
      content: ""; position: absolute; left: 0; top: 18px; height: 16px; width: 60%; border-radius: 8px; background: var(--rule);
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.45; } to { opacity: 1; } }

    .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }
    .empty .btn { margin-top: 14px; }

    /* Toasts: frosted glass */
    .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 10; width: min(92vw, 460px); }
    .toast {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 12px 12px 18px;
      background: var(--toast-bg); color: var(--toast-ink); border-radius: 18px;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.5); animation: toast-in 0.18s ease-out;
    }
    .toast.bad { background: var(--alert); color: var(--alert-ink); }
    .toast button { appearance: none; border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px 8px; min-height: 36px; cursor: pointer; border-radius: 10px; }
    .toast button:focus-visible { outline-color: currentColor; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Responsive ------------------------------------------------------ */
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .slip { position: static; }
    }
    @media (max-width: 680px) {
      .page { padding-top: 16px; }
      .masthead { padding: 14px 18px; }
      .register { padding: 16px; }
    }
    /* The register switches to stacked rows whenever its own column gets narrow. */
    @container (max-width: 720px) {
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      table, caption, tbody, tr, td { display: block; width: 100%; }
      caption { padding: 10px 4px 0; }
      tr { padding: 12px 4px; border-bottom: 1px solid var(--rule); }
      td { border: 0; padding: 2px 0; }
      td.num { text-align: left; }
      td[data-label]:not(.cell-name)::before { content: attr(data-label) ": "; color: var(--muted); }
      .row-actions { justify-content: flex-start; margin-top: 8px; }
      tr.confirm-row { padding-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      tbody tr.flash, .toast, .skeleton div::after { animation: none; }
      body, .btn, .chip, .link-btn, .theme-toggle { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead glass">
      <h1><span class="cross" aria-hidden="true"></span>Kabwe clinic directory</h1>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode">
        <span class="knob" aria-hidden="true">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        </span>
      </button>
    </header>

    <main class="layout">
      <form id="clinic-form" class="slip" novalidate aria-labelledby="form-title">
        <div class="slip-head">
          <h2 id="form-title">Add a clinic</h2>
          <span class="slip-no" id="form-ref"></span>
        </div>

        <input type="hidden" id="clinic-id">

        <div class="field">
          <label for="clinic_name">Clinic name <span class="req" aria-hidden="true">*</span></label>
          <input id="clinic_name" name="clinic_name" maxlength="150" required autocomplete="organization">
          <span class="err" id="clinic_name-err"></span>
        </div>
        <div class="field">
          <label for="doctor_name">Doctor in charge</label>
          <input id="doctor_name" name="doctor_name" maxlength="150" autocomplete="off">
          <span class="err" id="doctor_name-err"></span>
        </div>
        <div class="field">
          <label for="specialty">Specialty</label>
          <input id="specialty" name="specialty" maxlength="100" list="specialties" autocomplete="off">
          <datalist id="specialties">
            <option value="General Practice"><option value="Family Medicine"><option value="Paediatrics">
            <option value="Dentistry"><option value="Ophthalmology"><option value="Dermatology">
            <option value="Physiotherapy"><option value="Psychiatry"><option value="Emergency Medicine">
          </datalist>
          <span class="err" id="specialty-err"></span>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" maxlength="150" autocomplete="off">
          <span class="err" id="location-err"></span>
        </div>
        <div class="field-pair">
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" maxlength="20" inputmode="tel" autocomplete="off">
            <span class="err" id="phone-err"></span>
          </div>
          <div class="field">
            <label for="consultation_fee">Fee (K)</label>
            <input id="consultation_fee" name="consultation_fee" type="number" min="0" step="0.01" inputmode="decimal">
            <span class="err" id="consultation_fee-err"></span>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" maxlength="120" autocomplete="off">
          <span class="err" id="email-err"></span>
        </div>
        <div class="field">
          <label for="opening_hours">Opening hours</label>
          <input id="opening_hours" name="opening_hours" maxlength="100" placeholder="e.g. Mon-Fri 08:00-17:00" autocomplete="off">
          <span class="err" id="opening_hours-err"></span>
        </div>
        <label class="field-check" for="accepts_walk_ins">
          <input id="accepts_walk_ins" name="accepts_walk_ins" type="checkbox" checked>
          Walk-in patients welcome
        </label>

        <div class="slip-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add clinic</button>
          <button type="button" class="btn" id="cancel-btn" hidden>Cancel editing</button>
        </div>
      </form>

      <section class="register glass" aria-labelledby="register-title">
        <div class="register-bar">
          <h2 id="register-title">Registered clinics</h2>
          <label class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only">Search clinics</span>
            <input id="search" type="search" placeholder="Search clinics" aria-keyshortcuts="/">
          </label>
        </div>
        <div class="toolbar">
          <div class="chips" role="group" aria-label="Quick filters">
            <button type="button" class="chip" data-filter="open" aria-pressed="false"><span class="tick" aria-hidden="true">&#10003;</span>Open now <span class="n"></span></button>
            <button type="button" class="chip" data-filter="walkin" aria-pressed="false"><span class="tick" aria-hidden="true">&#10003;</span>Walk-ins welcome <span class="n"></span></button>
            <button type="button" class="chip" data-filter="free" aria-pressed="false"><span class="tick" aria-hidden="true">&#10003;</span>Free visits <span class="n"></span></button>
          </div>
          <label class="sort">Sort by
            <select id="sort">
              <option value="name">Name, A to Z</option>
              <option value="fee">Lowest fee first</option>
              <option value="open">Open now first</option>
              <option value="recent">Recently updated</option>
            </select>
          </label>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div id="register" aria-busy="true">
          <div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div></div>
          <p class="sr-only">Loading clinics</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
    // Light / dark toggle. With no saved choice the page follows the system setting.
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('theme-toggle');
      const systemDark = matchMedia('(prefers-color-scheme: dark)');
      const current = () => root.dataset.theme || (systemDark.matches ? 'dark' : 'light');
      function render() {
        const theme = current();
        root.dataset.theme = theme;
        button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      button.addEventListener('click', () => {
        root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) { /* not saved, still switches */ }
        render();
      });
      render();
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
